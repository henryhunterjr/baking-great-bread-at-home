name: Patch nanoid security advisory

on:
  push:
    branches:
      - security/nanoid-3.3.18

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nanoid patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh only the vulnerable transitive resolution
        shell: bash
        run: |
          npm pkg set overrides.nanoid=3.3.18
          npm install --package-lock-only --ignore-scripts
          git checkout -- package.json

      - name: Verify lockfile and build
        shell: bash
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages?.['node_modules/nanoid']?.version; if(v!=='3.3.18'){throw new Error('Expected nanoid 3.3.18, found '+v)}"
          npm ci --ignore-scripts
          npm run build

      - name: Commit security fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-nanoid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/patch-nanoid.yml
          git commit -m "fix: update nanoid to 3.3.18 [nanoid patched]"
          git push origin HEAD:security/nanoid-3.3.18
